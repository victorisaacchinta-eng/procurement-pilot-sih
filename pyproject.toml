# Vercel deploy config. The app runs as one Vercel Function; frontend/ is served from the CDN.
[project]
name = "procurement-pilot"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.4",
  "PyJWT==2.10.1",
  "python-dotenv==1.0.1",
  "psycopg[binary]==3.2.3",
  "pypdf==5.1.0",
  "python-multipart==0.0.20",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.fastapi.static]
cdn = true
